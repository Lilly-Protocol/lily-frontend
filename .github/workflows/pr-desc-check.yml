name: PR Description Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR body completeness
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').trim();
            const errors = [];
            const warnings = [];

            if (!body) {
              errors.push('PR body is empty. Please fill out the template.');
            } else {
              // Check for related issue reference
              const issueRef = /(?:closes|fixes|resolves)\s+#\d+/i;
              if (!issueRef.test(body)) {
                warnings.push('No related issue reference found (e.g., "Closes #123"). Consider linking an issue.');
              }

              // Check testing checklist has at least one tick
              const checkedBox = /\[[xX]\]/;
              if (!checkedBox.test(body)) {
                warnings.push('Testing checklist appears unchecked. Please confirm what was tested.');
              }

              // Check summary section is not just placeholder text
              const summaryMatch = body.match(/## Summary\s*([\s\S]*?)(?=##|$)/i);
              if (summaryMatch) {
                const summaryContent = summaryMatch[1].trim();
                if (!summaryContent || summaryContent.startsWith('Describe the problem')) {
                  errors.push('Summary section is empty or still contains placeholder text.');
                }
              }
            }

            let output = '';
            if (errors.length > 0) {
              output += '### ❌ PR Description Issues\n\n';
              errors.forEach(e => output += `- ${e}\n`);
              output += '\n';
            }
            if (warnings.length > 0) {
              output += '### ⚠️ Suggestions\n\n';
              warnings.forEach(w => output += `- ${w}\n`);
              output += '\n';
            }

            if (output) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output.trim()
              });
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('; '));
            } else if (warnings.length > 0) {
              core.warning(warnings.join('; '));
            }
