name: PR Description Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').trim();

            if (!body) {
              core.setFailed('PR description is empty.');
              return;
            }

            const summaryHeading = /^## Summary\s*$/im;
            const headingMatch = summaryHeading.exec(body);

            if (!headingMatch) {
              core.setFailed('PR description must include a ## Summary section.');
              return;
            }

            const afterSummary = body.slice(headingMatch.index + headingMatch[0].length);
            const nextHeadingIndex = afterSummary.search(/^##\s+/m);
            const summary = (
              nextHeadingIndex === -1
                ? afterSummary
                : afterSummary.slice(0, nextHeadingIndex)
            ).trim();

            if (!summary || summary.startsWith('Describe the problem')) {
              core.setFailed('The ## Summary section must contain a meaningful description.');
              return;
            }

            if (!/(?:closes|fixes|resolves)\s+#\d+/i.test(body)) {
              core.warning('No related issue reference found (for example, Closes #123).');
            }

            if (!/\[[xX]\]/.test(body)) {
              core.warning('No testing checklist items are checked.');
            }
