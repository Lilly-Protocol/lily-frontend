 name: PR Description Check
 
 on:
   pull_request:
     types: [opened, edited, synchronize]
 
 permissions:
   pull-requests: read
 
 jobs:
   check-description:
     name: Validate PR Description
     runs-on: ubuntu-latest
     timeout-minutes: 5
     steps:
       - name: Check PR description length
         uses: actions/github-script@v9
         with:
           script: |
             const pr = context.payload.pull_request;
             const body = pr.body || '';
             const minLength = 50;
             
             if (body.length < minLength) {
               core.setFailed(`PR description is too short (${body.length} chars). Minimum required: ${minLength} chars. Please provide a meaningful description of your changes.`);
             } else {
               console.log(`PR description length OK: ${body.length} chars`);
             }
