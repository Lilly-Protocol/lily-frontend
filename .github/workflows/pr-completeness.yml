name: PR Completeness Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-pr-body:
    name: Validate PR Description
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR body completeness
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const errors = [];
            const warnings = [];

            // Check for empty or placeholder body
            if (!body.trim() || body.trim().length < 20) {
              errors.push('PR description is empty or too short. Please provide context about the changes.');
            }

            // Check for related issue reference (e.g., "Closes #123", "Fixes #456")
            const issuePattern = /(closes|fixes|resolves)\s+#\d+/i;
            if (!issuePattern.test(body)) {
              warnings.push('No related issue reference found. Consider adding "Closes #<issue>" to link this PR.');
            }

            // Check for testing/validation mentions
            const testPattern = /(test|lint|build|check|validat)/i;
            if (!testPattern.test(body)) {
              warnings.push('No testing or validation details mentioned. Please describe how changes were verified.');
            }

            // Build comment body
            let comment = '';
            if (errors.length > 0) {
              comment += '## ⚠️ PR Description Issues\n\n';
              comment += errors.map(e => `- ❌ ${e}`).join('\n') + '\n\n';
            }
            if (warnings.length > 0) {
              comment += '### Suggestions\n\n';
              comment += warnings.map(w => `- 💡 ${w}`).join('\n') + '\n\n';
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('; '));
              if (comment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
              }
            } else if (warnings.length > 0 && comment) {
              // Post warnings as a non-blocking comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
