 name: PR Labeler
 
 on:
   pull_request:
     types: [opened, synchronize]
 
 permissions:
   contents: read
   pull-requests: write
 
 jobs:
   label:
     name: Auto-label PR
     runs-on: ubuntu-latest
     timeout-minutes: 5
     steps:
       - name: Checkout
         uses: actions/checkout@v4
 
       - name: Run PR Labeler
         uses: actions/labeler@v7
         with:
           repo-token: ${{ secrets.GITHUB_TOKEN }}
           sync-labels: true
