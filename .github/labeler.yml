app:
  - changed-files:
      - any-glob-to-any-file: 'src/app/**/*'

components:
  - changed-files:
      - any-glob-to-any-file: 'src/components/**/*'

features:
  - changed-files:
      - any-glob-to-any-file: 'src/features/**/*'

config:
  - changed-files:
      - any-glob-to-any-file: 'src/config/**/*'

types:
  - changed-files:
      - any-glob-to-any-file: 'src/types/**/*'

tests:
  - changed-files:
      - any-glob-to-any-file: 'src/test/**/*'

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**/*']

docs:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**/*']
